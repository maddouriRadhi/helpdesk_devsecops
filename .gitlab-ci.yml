# Pipeline DevSecOps bloquant : si une étape échoue, la suivante ne démarre pas.
#
# Variables GitLab à créer (Settings > CI/CD > Variables, en "Masked"/"Protected") :
#   KUBE_CONFIG     : contenu du kubeconfig du cluster (type File)
#   DAST_TARGET_URL : URL de l'application déployée à scanner (ex. https://helpdesk.exemple.tn)
#   DB_PASSWORD     : mot de passe PostgreSQL (utilisé pour créer le Secret Kubernetes)

stages:
  - build
  - test
  - sast
  - secrets
  - deps
  - image
  - image-scan
  - deploy
  - dast

variables:
  IMAGE_WEB: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
  IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  NODE_IMAGE: node:22-alpine

# 1. Build : compile le frontend et installe le backend
build:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci --include=dev
    - npm run build
    - cd backend && npm ci --omit=dev
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

# 2. Test : analyse statique du frontend et vérification de syntaxe du backend
#    (le projet n'a pas encore de tests unitaires : ajoute-les ici quand ils existent)
test:
  stage: test
  image: $NODE_IMAGE
  script:
    - npm ci --include=dev
    - npm run lint
    - node --check backend/server.js
    - node --check backend/db.js

# 3. SAST : analyse du code source (OWASP Top 10)
sast:
  stage: sast
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config p/owasp-top-ten --config p/javascript --config p/nodejs --error --metrics=off src backend/server.js backend/db.js

# 4. Secrets : détection de secrets dans le dépôt et l'historique
secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose

# 5. Dépendances : vulnérabilités connues dans les paquets npm
deps:
  stage: deps
  image: $NODE_IMAGE
  script:
    - npm audit --audit-level=high
    - cd backend && npm audit --audit-level=high --omit=dev

# 6. Image : construction et publication des images Docker
image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_WEB" .
    - docker build -t "$IMAGE_BACKEND" ./backend
    - docker push "$IMAGE_WEB"
    - docker push "$IMAGE_BACKEND"

# 7. Image scan : vulnérabilités dans les images (bloque sur HIGH/CRITICAL)
image-scan:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE_WEB"
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE_BACKEND"

# 8. Deploy : déploiement sur Kubernetes (branche main uniquement)
deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
  script:
    - export KUBECONFIG="$KUBE_CONFIG"
    - kubectl apply -f k8s/namespace.yaml
    - kubectl -n helpdesk create secret generic helpdesk-db --from-literal=DB_PASSWORD="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl -n helpdesk create secret docker-registry gitlab-registry --docker-server="$CI_REGISTRY" --docker-username="$CI_DEPLOY_USER" --docker-password="$CI_DEPLOY_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f k8s/
    - kubectl -n helpdesk set image deployment/web web="$IMAGE_WEB"
    - kubectl -n helpdesk set image deployment/backend backend="$IMAGE_BACKEND"
    - kubectl -n helpdesk rollout status deployment/db --timeout=180s
    - kubectl -n helpdesk rollout status deployment/backend --timeout=180s
    - kubectl -n helpdesk rollout status deployment/web --timeout=180s

# 9. DAST : scan dynamique de l'application déployée (OWASP ZAP)
dast:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t "$DAST_TARGET_URL" -r zap-report.html -I
  artifacts:
    when: always
    paths:
      - zap-report.html
    expire_in: 1 week
