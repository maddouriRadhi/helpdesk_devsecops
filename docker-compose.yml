services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD dans le fichier .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - back

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: helpdesk
      DB_USER: helpdesk
      DB_PASSWORD: ${DB_PASSWORD:?Définis DB_PASSWORD dans le fichier .env}
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front
      - back

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - front

volumes:
  db-data:

networks:
  front:
  back:
