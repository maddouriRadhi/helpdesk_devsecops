server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collecte les logs de tous les conteneurs Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Utiliser le nom du conteneur comme label
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Utiliser le nom de l'image comme label
      - source_labels: [__meta_docker_container_image]
        target_label: image
      # Label de l'application helpdesk
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # Parser les logs JSON du backend Express (winston)
      - json:
          expressions:
            level: level
            message: message
            security_event: security_event
            attack_type: attack_type
            ip: ip
            identifiant: identifiant
      # Extraire le niveau de log
      - labels:
          level:
          security_event:
          attack_type:
          service:
      # Marquer les événements de sécurité
      - match:
          selector: '{service="helpdesk_devsecops-backend-1"} |= "security_event"'
          stages:
            - labels:
                security_event: "true"
