# -----------------------------------------------------------------------
# Service – Frontend Nginx (ClusterIP interne, port 8080)
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: helpdesk
  labels:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
