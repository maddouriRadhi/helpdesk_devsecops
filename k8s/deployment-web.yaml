# -----------------------------------------------------------------------
# Deployment – Frontend (Nginx + React/Vite build)
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: helpdesk
  labels:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: helpdesk-web
      # Sécurité : non-root (nginx-unprivileged tourne avec uid 101)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          # L'image est mise à jour par la pipeline GitLab CI
          image: registry.gitlab.com/YOUR_GROUP/helpdesk-devsecops/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Nginx a besoin d'écriture dans /tmp et /var/cache
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: gitlab-registry
