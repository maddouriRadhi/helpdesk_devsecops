# -----------------------------------------------------------------------
# Secret Kubernetes – Identifiants de la base de données
# -----------------------------------------------------------------------
# NE PAS committer ce fichier avec de vraies valeurs !
# En production, ce secret est créé via la pipeline GitLab CI :
#   kubectl -n helpdesk create secret generic helpdesk-db \
#     --from-literal=DB_PASSWORD="$DB_PASSWORD" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Valeurs ci-dessous encodées en base64 (exemple local uniquement) :
#   echo -n 'changeme' | base64  →  Y2hhbmdlbWU=
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-db
  namespace: helpdesk
  labels:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/component: database
type: Opaque
data:
  # Remplace par : echo -n '<ton_mot_de_passe>' | base64
  DB_PASSWORD: Y2hhbmdlbWU=
