# -----------------------------------------------------------------------
# Service – PostgreSQL (ClusterIP interne, port 5432)
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: helpdesk
  labels:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
