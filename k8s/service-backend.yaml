# -----------------------------------------------------------------------
# Service – Backend Express.js (ClusterIP interne, port 3000)
# -----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: helpdesk
  labels:
    app.kubernetes.io/name: helpdesk
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
